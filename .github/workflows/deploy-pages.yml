name: Deploy to GitHub Pages

# Publishes the app to the gh-pages branch, which GitHub Pages serves.
# (The artifact-based Pages deploy needs the site pre-enabled with admin
# rights the workflow token doesn't have; branch publishing does not.)

on:
  push:
    branches:
      - main
      - claude/orbital-rocket-simulator-pwa-jxmfs9
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics mission test
        run: node test/mission.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest sw.js src vendor icons _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'Publish site from ${{ github.sha }}'
